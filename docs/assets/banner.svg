<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">tg://companion — a hidden production screen in Telegram-iOS that feeds a vendored GLTF parser from a mutable channel</title>
  <desc id="desc">Dark banner: monospace title, subtitle, and a five-node chain from the tg://companion deep link through OpenUrl, DebugCompanionScreen, cgltf, to Metal.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#30363D" stroke-width="1"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="#0B0E14"/>

  <!-- faint vertical rules -->
  <g stroke="#161B22" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
  </g>

  <!-- accent rule -->
  <rect x="72" y="60" width="44" height="2" fill="#58A6FF"/>

  <!-- signature -->
  <text x="1208" y="64" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.6" fill="#484F58">nimo</text>

  <!-- title -->
  <text x="72" y="130" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="56" font-weight="600" letter-spacing="-1" fill="#E6EDF3">tg://companion</text>

  <!-- subtitle -->
  <text x="74" y="164" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="0.2" fill="#8B949E">Telegram-iOS &#183; hidden production screen &#183; vendored GLTF parser</text>

  <!-- divider -->
  <line x1="72" y1="190" x2="1208" y2="190" stroke="#21262D" stroke-width="1"/>

  <!-- five-node chain -->
  <g stroke="#30363D" stroke-width="1" marker-end="url(#arrow)">
    <line x1="124" y1="240" x2="370" y2="240"/>
    <line x1="384" y1="240" x2="630" y2="240"/>
    <line x1="644" y1="240" x2="890" y2="240"/>
    <line x1="904" y1="240" x2="1150" y2="240"/>
  </g>

  <g fill="#0B0E14" stroke-width="1.2">
    <circle cx="120" cy="240" r="4" stroke="#30363D"/>
    <circle cx="380" cy="240" r="4" stroke="#30363D"/>
    <circle cx="640" cy="240" r="4.5" stroke="#58A6FF"/>
    <circle cx="900" cy="240" r="4" stroke="#30363D"/>
    <circle cx="1160" cy="240" r="4" stroke="#30363D"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="0.4" fill="#8B949E" text-anchor="middle">
    <text x="120" y="268">tg://companion</text>
    <text x="380" y="268">OpenUrl</text>
    <text x="640" y="268" fill="#C9D1D9">DebugCompanionScreen</text>
    <text x="900" y="268">cgltf / glTF</text>
    <text x="1160" y="268">Metal</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="0.3" fill="#484F58" text-anchor="middle">
    <text x="120" y="286">deeplink</text>
    <text x="380" y="286">URL host check</text>
    <text x="640" y="286">no debug gate</text>
    <text x="900" y="286">channel content</text>
    <text x="1160" y="286">render</text>
  </g>
</svg>
